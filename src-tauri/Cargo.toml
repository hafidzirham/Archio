[package]
name = "archio"
version = "1.0.0"
description = "Archio"
authors = ["Archio"]
edition = "2021"

[lib]
name = "archio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
